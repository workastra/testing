name: Playwright Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      workastra_platform_ref:
        required: true
        default: main
        type: string
      workastra_desk_ref:
        required: true
        default: main
        type: string
      helm_ref:
        required: true
        default: main
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

env:
  NAMESPACE: workastra
  DESK_PATH: modules/desk
  PLATFORM_PATH: modules/platform
  HELM_PATH: modules/helm
  TESTING_PATH: modules/testing

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    name: E2E
    steps:
      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          minikube-version: '1.38.1'
          container-runtime: containerd
          kubernetes-version: v1.35.1
          nodes: 1
      
      - name: Setup Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: '4.1.1'

      - name: Verify cluster
        run: kubectl get pods -A
      
      - name: Checkout workastra/desk
        uses: actions/checkout@v6
        with:
          repository: workastra/desk
          path: ${{ env.DESK_PATH }}
          ref: ${{ github.event.inputs.workastra_desk_ref || 'feat/authentication' }}

      - name: Checkout workastra/platform
        uses: actions/checkout@v6
        with:
          repository: workastra/platform
          path: ${{ env.PLATFORM_PATH }}
          ref: ${{ github.event.inputs.workastra_platform_ref || 'main' }}

      - name: Checkout workastra/helm
        uses: actions/checkout@v6
        with:
          repository: workastra/helm
          path: ${{ env.HELM_PATH }}
          ref: ${{ github.event.inputs.helm_ref || 'feat/workastra-desk-helm-chart' }}
      
      - name: Checkout workastra/testing
        uses: actions/checkout@v6
        with:
          path: ${{ env.TESTING_PATH }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Build and push image to local registry
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: ${{ env.PLATFORM_PATH }}
      #     push: true
      #     tags: ${{ steps.kind.outputs.LOCAL_REGISTRY }}/workastra-platform:latest
      
      - name: Build and push image to local registry
        id: build-workastra-desk
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.DESK_PATH }}
          push: false
          load: true
          tags: workastra-desk:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Load image to minikube
        run: minikube image load workastra-desk:latest
      
      - name: Minikube images
        run: minikube image ls

      - name: Install Envoy Gateway
        run: helm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.7.0 -n envoy-gateway-system --create-namespace
      
      - name: Setup Gateway API
        run: |
          kubectl apply -f - <<EOF
          apiVersion: gateway.networking.k8s.io/v1
          kind: GatewayClass
          metadata:
            name: eg
          spec:
            controllerName: gateway.envoyproxy.io/gatewayclass-controller
          ---
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: eg
          spec:
            gatewayClassName: eg
            listeners:
              - name: http
                protocol: HTTP
                port: 80
                allowedRoutes:
                  namespaces:
                    from: All
          EOF

      - name: Prepare Helm values
        working-directory: ${{ env.HELM_PATH }}
        run: |
          tee override-values.yaml <<EOF
          global:
            scheme: http
            domain: workastra.com

            httpRoute:
              parentRefs:
                - name: eg
                  namespace: default
                  sectionName: http

          desk:
            enabled: true

            image:
              repository: docker.io/library/workastra-desk

            secrets:
              keys:
                - $(openssl rand -base64 32 | head -c 32; echo)
              oauth2:
                clientSecret: secret
          EOF

      - name: Helm Template
        working-directory: ${{ env.HELM_PATH }}
        run: |
          helm template workastra . \
            -n ${{ env.NAMESPACE }} \
            -f values.yaml \
            -f override-values.yaml
      
      - name: Deploy with Helm
        working-directory: ${{ env.HELM_PATH }}
        run: |
          helm install workastra . \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f override-values.yaml

      - name: Wait for Envoy Gateway
        run: kubectl wait --timeout=5m -n envoy-gateway-system deployment/envoy-gateway --for=condition=Available

      - name: Wait for Envoy Gateway & App
        run: kubectl -n ${{ env.NAMESPACE }} rollout status deployment/workastra-desk --timeout=30s

      - name: Debugging info
        if: ${{ always() }}
        run: kubectl -n ${{ env.NAMESPACE }} get all

      - name: Allow ip and route without password
        run: |
          echo "$USER ALL=(ALL) NOPASSWD: /sbin/ip, /sbin/route, /usr/sbin/ip, /usr/sbin/route" | sudo tee /etc/sudoers.d/minikube
          sudo chmod 440 /etc/sudoers.d/minikube
      
      - name: Minikube tunnel
        run: |
          minikube tunnel &
          
          echo "Waiting for LoadBalancer IP..."

          # 1. Wait directly on the selector (no need to fetch service name first)
          kubectl wait svc -n envoy-gateway-system \
            --selector=gateway.envoyproxy.io/owning-gateway-name=eg \
            --for=jsonpath='{.status.loadBalancer.ingress[0].ip}' \
            --timeout=90s

          # 2. Extract IP and update hosts in one go
          EXT_IP=$(kubectl get svc -n envoy-gateway-system \
            --selector=gateway.envoyproxy.io/owning-gateway-name=eg \
            -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}')
          
          echo "Updating /etc/hosts to point desk.workastra.com to $EXT_IP"
          echo "$EXT_IP desk.workastra.com" | sudo tee -a /etc/hosts
      
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '25.4.0'
          cache: pnpm
          cache-dependency-path: ${{ env.TESTING_PATH }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.TESTING_PATH }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ${{ env.TESTING_PATH }}
        run: pnpm run playwright:install chromium-headless-shell

      - name: Run Playwright tests
        working-directory: ${{ env.TESTING_PATH }}
        env:
          APP_BASE_URL: http://desk.workastra.com
        run: pnpm run playwright:test --project=chromium

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.TESTING_PATH }}/playwright-report/
          retention-days: 30
