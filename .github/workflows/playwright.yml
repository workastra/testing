---
name: Playwright Tests

on:
  push:
    branches:
      - v0
  pull_request:
    branches:
      - v0
  workflow_dispatch:
    inputs:
      platform_ref:
        type: string
      desk_ref:
        type: string
      helm_ref:
        type: string
      testing_ref:
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Prepare Refs
    env:
      HELM_CHART_REF: v0
      DESK_REF: v0
      PLATFORM_REF: v0
      TESTING_REF: v0
    outputs:
      helm_ref: ${{ steps.final.outputs.helm }}
      desk_ref: ${{ steps.final.outputs.desk }}
      platform_ref: ${{ steps.final.outputs.platform }}
      testing_ref: ${{ steps.final.outputs.testing }}
    steps:
      # ===============================
      # 1. PR Logic
      # ===============================
      - name: Set refs (PR)
        if: github.event_name == 'pull_request'
        id: set_pr
        run: |
          echo "helm=${{ github.event.inputs.helm_ref || env.HELM_CHART_REF }}" >> $GITHUB_OUTPUT
          echo "desk=${{ github.event.inputs.desk_ref || env.DESK_REF }}" >> $GITHUB_OUTPUT
          echo "platform=${{ github.event.inputs.platform_ref || env.PLATFORM_REF }}" >> $GITHUB_OUTPUT
          echo "testing=${{ github.event.inputs.testing_ref || github.head_ref }}" >> $GITHUB_OUTPUT

      # ===============================
      # 2. Workflow Dispatch Logic
      # ===============================
      - name: Set refs (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: set_dispatch
        run: |
          echo "helm=${{ github.event.inputs.helm_ref || env.HELM_CHART_REF }}" >> $GITHUB_OUTPUT
          echo "desk=${{ github.event.inputs.desk_ref || env.DESK_REF }}" >> $GITHUB_OUTPUT
          echo "platform=${{ github.event.inputs.platform_ref || env.PLATFORM_REF }}" >> $GITHUB_OUTPUT
          echo "testing=${{ github.event.inputs.testing_ref || env.TESTING_REF }}" >> $GITHUB_OUTPUT

      # ===============================
      # 3. Push Main Logic
      # ===============================
      - name: Set refs (push)
        if: github.event_name == 'push'
        id: set_push
        run: |
          echo "helm=${{ env.HELM_CHART_REF }}" >> $GITHUB_OUTPUT
          echo "desk=${{ env.DESK_REF }}" >> $GITHUB_OUTPUT
          echo "platform=${{ env.PLATFORM_REF }}" >> $GITHUB_OUTPUT
          echo "testing=${{ env.TESTING_REF }}" >> $GITHUB_OUTPUT

      # ===============================
      # 4. Consolidate Outputs
      # ===============================
      - name: Finalize Outputs
        id: final
        run: |
          # This picks the output from whichever step actually executed
          echo "helm=${{ steps.set_pr.outputs.helm || steps.set_dispatch.outputs.helm || steps.set_push.outputs.helm }}" >> $GITHUB_OUTPUT
          echo "desk=${{ steps.set_pr.outputs.desk || steps.set_dispatch.outputs.desk || steps.set_push.outputs.desk }}" >> $GITHUB_OUTPUT
          echo "platform=${{ steps.set_pr.outputs.platform || steps.set_dispatch.outputs.platform || steps.set_push.outputs.platform }}" >> $GITHUB_OUTPUT
          echo "testing=${{ steps.set_pr.outputs.testing || steps.set_dispatch.outputs.testing || steps.set_push.outputs.testing }}" >> $GITHUB_OUTPUT

      - name: Confirm Refs
        run: |
          echo "Using workastra/helm: ${{ steps.final.outputs.helm }}"
          echo "Using workastra/desk: ${{ steps.final.outputs.desk }}"
          echo "Using workastra/platform: ${{ steps.final.outputs.platform }}"
          echo "Using workastra/testing: ${{ steps.final.outputs.testing }}"

  build-images:
    runs-on: ubuntu-latest
    name: Build image (${{ matrix.service }})
    needs: [prepare]
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: Desk
            repository: workastra/desk
            path: modules/desk
            ref: ${{ needs.prepare.outputs.desk_ref }}
            docker:
              repository: workastra/desk
              file: modules/desk/Dockerfile
          - service: IAM
            repository: workastra/platform
            path: modules/platform
            ref: ${{ needs.prepare.outputs.platform_ref }}
            docker:
              repository: workastra/platform/iam
              file: modules/platform/iam/jvm.Dockerfile
          - service: Migration
            repository: workastra/platform
            path: modules/platform
            ref: ${{ needs.prepare.outputs.platform_ref }}
            docker:
              repository: workastra/platform/migration
              file: modules/platform/migration/jvm.Dockerfile
    steps:
      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repository }}
          path: ${{ matrix.path }}
          ref: ${{ matrix.ref }}
          fetch-depth: 1

      - run: mkdir -p ${{ runner.temp }}/build_out

      - name: Compute image metadata
        id: meta
        working-directory: ${{ matrix.path }}
        run: |
          TAG=$(git rev-parse --short HEAD)
          SERVICE=$(echo "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          SAFE_REPO=$(echo "${{ matrix.docker.repository }}" | sed 's/\//__/g')

          IMAGE="${{ matrix.docker.repository }}:$TAG"
          TARBALL="${SAFE_REPO}-${TAG}.tar"                   # Safe filename: "workastra/desk" → "workastra__desk-<sha>.tar"
          ARTIFACT_NAME="build-${SAFE_REPO}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg repo  "${{ matrix.docker.repository }}" \
            --arg tag   "$TAG" \
            --arg image "$IMAGE" \
            --arg tar   "$TARBALL" \
            '{repository:$repo,tag:$tag,image:$image,tarball:$tar}' \
            > "${{ runner.temp }}/build_out/metadata.json"

      - name: Print metadata
        run: cat ${{ runner.temp }}/build_out/metadata.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.docker.file }}
          tags: ${{ steps.meta.outputs.image }}
          outputs: type=docker,dest=${{ runner.temp }}/build_out/${{ steps.meta.outputs.tarball }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/build_out/
          retention-days: 1

  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    name: E2E
    needs:
      - prepare
      # - build-images
    env:
      HELM_PATH: modules/helm
      TESTING_PATH: modules/testing
      TENANT_NAME: workastra
      DOMAIN: workastra.com
    steps:
      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          minikube-version: 1.38.1
          container-runtime: containerd
          kubernetes-version: v1.35.1
          nodes: 1

      - name: Setup Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: 4.1.1

      - name: Verify cluster
        run: kubectl get pods -A

      - name: Checkout workastra/helm
        uses: actions/checkout@v6
        with:
          repository: workastra/helm
          path: ${{ env.HELM_PATH }}
          ref: ${{ needs.prepare.outputs.helm_ref }}

      - name: Checkout workastra/testing
        uses: actions/checkout@v6
        with:
          path: ${{ env.TESTING_PATH }}
          ref: ${{ needs.prepare.outputs.testing_ref }}

      - name: Wait for "${{ env.JOB_NAME }}" jobs to complete
        env:
          JOB_NAME: Build image
          POLL_INTERVAL: 10
          INITIAL_WAIT: 5
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 15
        working-directory: ${{ env.TESTING_PATH }}
        run: |
          wait_for_jobs() {
            local job_name="$1"

            while true; do
              local timestamp
              timestamp=$(date '+%H:%M:%S')

              mapfile -t RESULTS < <(gh run view "$GITHUB_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --json jobs \
                -q ".jobs[] | select(.name | startswith(\"$job_name\")) | .conclusion")

              if [ ${#RESULTS[@]} -eq 0 ]; then
                echo "[$timestamp] ⏳ No jobs matching \"$job_name\" found yet — retrying in ${INITIAL_WAIT}s..."
                sleep "$INITIAL_WAIT"
                continue
              fi

              local total=${#RESULTS[@]}
              local success
              success=$(printf '%s\n' "${RESULTS[@]}" | grep -c '^success$')
              local pending=$(( total - success ))

              echo "[$timestamp] 📊 \"$job_name\" status: $success/$total succeeded, $pending not yet succeeded"

              if [ "$pending" -eq 0 ]; then
                echo "[$timestamp] ✅ All $total \"$job_name\" jobs succeeded"
                return 0
              fi

              local failed
              failed=$(printf '%s\n' "${RESULTS[@]}" | grep -v '^success$' | grep -v '^$' | wc -l)

              if [ "$failed" -gt 0 ]; then
                echo "[$timestamp] ❌ $failed job(s) in a non-success terminal state — aborting"
                printf '%s\n' "${RESULTS[@]}" | grep -v '^success$' | grep -v '^$' | while read -r status; do
                  echo "[$timestamp]    → $status"
                done
                return 1
              fi

              echo "[$timestamp] ⏳ Waiting on $pending job(s) — retrying in ${POLL_INTERVAL}s..."
              sleep "$POLL_INTERVAL"
            done
          }

          wait_for_jobs "$JOB_NAME"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: false

      - name: Load images into minikube
        id: images
        run: |
          while IFS= read -r -d '' meta_file; do
            dir=$(dirname "$meta_file")

            read -r REPO TAG IMG TAR < <(
              jq -r '[.repository,.tag,.image,.tarball] | @tsv' "$meta_file"
            )

            echo "Loading $IMG from $dir/$TAR …"
            minikube image load "$dir/$TAR"
            echo "Loaded $IMG ✓"

            KEY="${REPO##*/}"
            KEY="${KEY^^}"

            echo "Exporting output keys:"
            echo "  ${KEY}_TAG=$TAG"
            echo "  ${KEY}_REPO=$REPO"

            echo "${KEY}_TAG=$TAG"   >> "$GITHUB_OUTPUT"
            echo "${KEY}_REPO=$REPO" >> "$GITHUB_OUTPUT"
          done < <(find "${{ runner.temp }}/artifacts" -name "metadata.json" -print0)

      - name: Verify minikube image list
        run: minikube image ls

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Deploy environment on Minikube
        working-directory: ${{ env.HELM_PATH }}
        env:
          TENANT_NAME: ${{ env.TENANT_NAME }}
          DOMAIN: ${{ env.DOMAIN }}
          MIGRATION_IMAGE_REPOSITORY: ${{ steps.images.outputs.MIGRATION_REPO }}
          MIGRATION_IMAGE_TAG: ${{ steps.images.outputs.MIGRATION_TAG }}
          DESK_IMAGE_REPOSITORY: ${{ steps.images.outputs.DESK_REPO }}
          DESK_IMAGE_TAG: ${{ steps.images.outputs.DESK_TAG }}
          IAM_IMAGE_REPOSITORY: ${{ steps.images.outputs.IAM_REPO }}
          IAM_IMAGE_TAG: ${{ steps.images.outputs.IAM_TAG }}
        run: task --dir .github/actions/deploy deploy

      - name: Allow ip and route without password
        run: |
          echo "$USER ALL=(ALL) NOPASSWD: /sbin/ip, /sbin/route, /usr/sbin/ip, /usr/sbin/route" | sudo tee /etc/sudoers.d/minikube
          sudo chmod 440 /etc/sudoers.d/minikube

      - name: Minikube tunnel
        run: |
          minikube tunnel &

          echo "Waiting for LoadBalancer IP..."

          # 1. Wait directly on the selector (no need to fetch service name first)
          kubectl wait svc -n envoy-gateway-system \
            --selector=gateway.envoyproxy.io/owning-gateway-name=eg \
            --for=jsonpath='{.status.loadBalancer.ingress[0].ip}' \
            --timeout=90s

          # 2. Extract IP and update hosts in one go
          EXT_IP=$(kubectl get svc -n envoy-gateway-system \
            --selector=gateway.envoyproxy.io/owning-gateway-name=eg \
            -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}')

          echo "Updating /etc/hosts to point ${{ env.DOMAIN }} to $EXT_IP"
          echo "$EXT_IP ${{ env.DOMAIN }}" | sudo tee -a /etc/hosts

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.TESTING_PATH }}/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ${{ env.TESTING_PATH }}/package.json
          cache: pnpm
          cache-dependency-path: ${{ env.TESTING_PATH }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.TESTING_PATH }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ${{ env.TESTING_PATH }}
        run: pnpm run playwright:install chromium-headless-shell

      - name: Run Playwright tests
        working-directory: ${{ env.TESTING_PATH }}
        env:
          APP_BASE_URL: http://workastra.com
        run: pnpm run playwright:test --project=chromium

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.TESTING_PATH }}/playwright-report/
          retention-days: 30

  cleanup:
    runs-on: ubuntu-latest
    name: Cleanup
    needs: [e2e]
    if: ${{ !cancelled() }}
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch build artifact IDs
        run: |
          gh api --paginate "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("build-")) | [.id, .name] | @tsv' \
            > artifacts.tsv

          echo "Found $(wc -l < artifacts.tsv) artifact(s) to delete:"
          cat artifacts.tsv

      - name: Delete build artifacts
        run: |
          while IFS=$'\t' read -r id name; do
            echo "Deleting $name …"
            gh api --method DELETE "/repos/${{ github.repository }}/actions/artifacts/$id"
            echo "Deleted $name ✓"
          done < artifacts.tsv
